name: Rasm tekshiruvi
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium webkit firefox
      - name: browser test
        run: mkdir -p out && node tools/diag.js
      - name: save
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -f out; git commit -m "diag natija 2" || true; git push
