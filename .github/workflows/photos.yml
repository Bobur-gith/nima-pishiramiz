name: Taom suratlari
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/dishes.json', 'tools/photos.mjs']
permissions:
  contents: write
concurrency:
  group: photos
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/photos.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add -f data/photos.js tools/photo-report.json tools/photo-log.txt || true
          git commit -m "Suratlar yangilandi" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
